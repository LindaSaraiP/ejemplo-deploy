<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página de Ejemplo</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Mi Página Web</h1>
        <p>Proyecto de ejemplo para GitHub Pages</p>
    </header>

    <main>
        <section class="tarjeta">
            <h2>¡Hola! 👋</h2>
            <p>
                Esta es una página web sencilla creada con HTML y CSS.
            </p>

            <p>
                El objetivo de este proyecto es aprender a publicar
                una página estática utilizando GitHub Pages.
            </p>

            <button onclick="mostrarMensaje()">Haz clic aquí</button>
        </section>
    </main>

    <footer>
        <p>Proyecto de ejemplo - 2026</p>
    </footer>

    <script>
        function mostrarMensaje() {
            alert("¡GitHub Pages funciona correctamente! 🎉");
        }
    </script>

</body>
</html>
